<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Word Academy">
<meta name="theme-color" content="#185abd">
<title>Word 365 Academy – Simulatore e Corso Interattivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#185abd;--blue-d:#103f91;--blue-l:#d6e6f8;--accent:#185abd;
  --frame:#f3f3f3;--card:#ffffff;--line:#e1e1e1;--hover:#ebebeb;--press:#dcdcdc;--on:#d6d6d6;--on-h:#c9c9c9;--txt:#242424;--mut:#616161;
  --canvas:#e9e9e9;--ui:'Segoe UI','Segoe UI Variable Text','Selawik','Noto Sans','Helvetica Neue',Arial,sans-serif;
  --body:'Calibri','Carlito','Segoe UI',Arial,sans-serif;--head:'Calibri Light','Carlito','Calibri',Arial,sans-serif;
  --h1c:#2f5496;--h3c:#1f3763;--rib:var(--frame);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--frame);color:var(--txt);font:12px var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh}
svg.ic{width:20px;height:20px;fill:none;stroke:#424242;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;flex:none;overflow:visible}
svg.ic.l{width:32px;height:32px;stroke-width:1.05}
svg.ic.s{width:16px;height:16px}
.ic .f{fill:#424242;stroke:none}.ic .fb{fill:#2b7cd3;stroke:none}.ic .sb{stroke:#185abd}.ic .fw{fill:#fff}.ic .fy{fill:#ffd23f;stroke:#c9a100}
.ic .fr{fill:#d13438;stroke:none}.ic .fg{fill:#107c41;stroke:none}.ic .sg{stroke:#107c41}.ic .so{stroke:#d9691f}.ic .fo{fill:#f0883e;stroke:none}
.ic .sr{stroke:#d13438}.ic .fl{fill:#e3eefb;stroke:#2b6cc4}.ic .fgy{fill:#e9e9e9;stroke:#8a8a8a}.ic .fgl{fill:#dff3e7;stroke:#107c41}
.ic .fol{fill:#fde9d9;stroke:#d9691f}.ic text{font:700 16px 'Segoe UI','Noto Sans',Arial,sans-serif;text-anchor:middle;fill:#333;stroke:none}
.ic text.sm{font-size:9px}.ic .bar{stroke:none}

/* ---------- Barra del titolo ---------- */
#title{background:var(--blue);color:#fff;height:40px;display:flex;align-items:center;padding:0 8px 0 4px;gap:4px;flex:none;user-select:none;position:relative}
#title .logo{width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:0}
#title .logo:hover{background:rgba(255,255,255,.14)}
#title .logo svg .f{fill:#fff}
#title .appname{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;padding:0 8px 0 2px}
#title .tb{background:none;border:0;color:#fff;width:32px;height:32px;border-radius:4px;display:grid;place-items:center}
#title .tb:hover{background:rgba(255,255,255,.16)}#title .tb:active{background:rgba(255,255,255,.26)}
#title .tb svg.ic{stroke:#fff;width:18px;height:18px}#title .tb svg .f{fill:#fff}
#title .tb svg .fl,#title .tb svg .fw,#title .tb svg .fgy{fill:transparent;stroke:#fff}
#title .tb.dis{opacity:.45;pointer-events:none}
#title .sep{width:1px;height:20px;background:rgba(255,255,255,.28);margin:0 4px}
.as{display:flex;align-items:center;gap:7px;background:none;border:0;color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;white-space:nowrap}
.as:hover{background:rgba(255,255,255,.14)}
.as i{width:30px;height:15px;border-radius:8px;border:1px solid #fff;position:relative;transition:.15s}
.as i::after{content:"";position:absolute;left:2px;top:2px;width:9px;height:9px;border-radius:50%;background:#fff;transition:.15s}
.as.on i{background:#fff}.as.on i::after{left:17px;background:var(--blue)}
.as b{font-weight:400;opacity:.9;min-width:20px;text-align:left}
.dnwrap{display:flex;align-items:center;gap:2px;min-width:0}
#docname{background:transparent;border:1px solid transparent;color:#fff;font-weight:600;font-size:13px;padding:3px 6px;border-radius:4px;width:150px;outline:0;text-overflow:ellipsis}
#docname:hover{background:rgba(255,255,255,.14)}#docname:focus{background:#fff;color:#222}
#savestate{font-size:12px;opacity:.92;display:flex;align-items:center;gap:6px;white-space:nowrap}
#savestate i{width:4px;height:4px;border-radius:50%;background:#fff;display:inline-block;opacity:.8}
#savestate.unsaved{opacity:1}#savestate.unsaved i{background:#ffc83d;width:7px;height:7px;opacity:1}
#search{flex:1;max-width:480px;min-width:160px;margin:0 auto;position:relative}
#search input{width:100%;height:30px;border-radius:6px;border:1px solid transparent;background:rgba(255,255,255,.9);color:#242424;padding:0 10px 0 32px;outline:0;font-size:13px}
#search input::placeholder{color:#616161}#search input:hover{background:#fff}#search input:focus{background:#fff;border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.45)}
#search svg{position:absolute;left:10px;top:7px;stroke:#424242;width:16px;height:16px}
#searchres{position:absolute;top:34px;left:0;right:0;background:#fff;color:#242424;border:1px solid #e0e0e0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:200;max-height:340px;overflow:auto;display:none;padding:4px}
#searchres .sh{padding:6px 10px 4px;color:#616161;font-size:11px;font-weight:600}
#searchres div.it{padding:7px 10px;display:flex;gap:10px;align-items:center;cursor:pointer;border-radius:4px}#searchres div.it:hover,#searchres div.it.sel{background:#f0f0f0}
#searchres small{color:#757575;margin-left:auto}
#title .right{display:flex;align-items:center;gap:6px;margin-left:8px}
#user{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 10px;border-radius:4px;font-size:12px;cursor:pointer;white-space:nowrap}
#user:hover{background:rgba(255,255,255,.14)}
#user b{width:28px;height:28px;border-radius:50%;background:#c19c00;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
#academyBtn{background:#ffb900;color:#3b2a00;border:0;border-radius:4px;padding:5px 12px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
#academyBtn:hover{background:#ffc83d}#academyBtn svg *{stroke:#3b2a00!important;fill:none!important}

/* ---------- Schede ---------- */
#tabs{background:var(--frame);display:flex;align-items:center;padding:0 8px;height:38px;flex:none;user-select:none;overflow:hidden;gap:0}
.tab{color:#424242;padding:0 10px;height:32px;display:flex;align-items:center;font-size:13px;cursor:pointer;border-radius:4px;position:relative;white-space:nowrap}
.tab span{display:inline-flex;flex-direction:column;align-items:center}
.tab span::after{content:attr(data-l);font-weight:600;height:0;visibility:hidden;overflow:hidden}
.tab:hover{background:#e6e6e6;color:#242424}
.tab.active{color:var(--blue);font-weight:600}
.tab.active::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:3px;border-radius:2px;background:var(--blue)}
.tab.ctx{color:#7719aa}.tab.ctx.active{color:#7719aa}.tab.ctx.active::after{background:#7719aa}.tab.ctx:hover{background:#f1e6f8}.tab.ctx:first-of-type{margin-left:6px}
.tab.ctx::before{content:"";position:absolute;left:-4px;top:8px;bottom:8px;width:1px;background:#d0d0d0}
.tab.ctx+.tab.ctx::before{display:none}
#tabright{margin-left:auto;display:flex;align-items:center;gap:6px;padding-left:10px}
.tbtn{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:4px;border:1px solid #d1d1d1;background:#fff;font-size:12.5px;white-space:nowrap}
.tbtn:hover{background:#f5f5f5;border-color:#c7c7c7}
.tbtn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.tbtn.pri:hover{background:var(--blue-d)}
.tbtn.pri svg *{stroke:#fff!important}
#ribtoggle{background:none;border:0;width:30px;height:30px;border-radius:4px;display:grid;place-items:center}#ribtoggle:hover{background:#e6e6e6}
#ribtoggle svg{width:14px;height:14px}

/* ---------- Barra multifunzione ---------- */
#ribbon{background:var(--frame);height:110px;padding:0 8px 8px;flex:none;overflow:hidden;position:relative;z-index:30}
#ribbon.collapsed{height:0;padding:0}
#ribbon.float{position:absolute;top:78px;left:0;right:0;height:110px;z-index:60;background:transparent}
#ribbon.float .rpanel{box-shadow:0 8px 24px rgba(0,0,0,.22)}
.rpanel{display:none;height:102px;padding:4px 4px 0;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:var(--card);border:1px solid #e3e3e3;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.rpanel.show{display:flex}
.rpanel::-webkit-scrollbar{height:6px}.rpanel::-webkit-scrollbar-thumb{background:#c8c8c8;border-radius:3px}
.grp{display:flex;flex-direction:column;padding:0 6px;position:relative;flex:none}
.grp+.grp::before{content:"";position:absolute;left:0;top:4px;bottom:6px;width:1px;background:#e1e1e1}
.grp .body{display:flex;gap:2px;flex:1;align-items:stretch;padding-top:1px}
.grp .lbl{text-align:center;font-size:11px;color:var(--mut);height:18px;line-height:17px;padding:0 14px;white-space:nowrap}
.grp .launch{position:absolute;right:3px;bottom:3px;width:13px;height:13px;border:0;background:none;padding:0;opacity:.75;border-radius:2px}
.grp .launch::after{content:"";position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-right:1.3px solid #555;border-bottom:1.3px solid #555}
.grp .launch::before{content:"";position:absolute;right:3px;bottom:3px;width:8px;height:1.3px;background:#555;transform:rotate(-45deg);transform-origin:right}
.grp .launch:hover{opacity:1;background:var(--hover)}
.col{display:flex;flex-direction:column;justify-content:center;gap:2px}
.row{display:flex;align-items:center;gap:1px;height:24px}
.btn{border:1px solid transparent;background:transparent;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 4px;height:24px;color:var(--txt);position:relative;white-space:nowrap;font-size:12px}
.btn:hover{background:var(--hover)}
.btn:active{background:var(--press)}
.btn.on{background:var(--on)}
.btn.on:hover{background:var(--on-h)}
.btn.big{flex-direction:column;height:auto;min-width:48px;padding:3px 5px 2px;gap:2px;justify-content:flex-start;line-height:1.15;font-size:12px;white-space:normal;text-align:center}
.btn.big .t{display:block;max-width:76px}
.btn.big[data-id=hfClose] .t{max-width:130px}
.btn .car{width:0;height:0;border:3.5px solid transparent;border-top:4px solid #616161;margin-top:2px}
.btn.big .car{margin-top:1px}
.btn.w{padding:0 5px;justify-content:flex-start}
.splitwrap{display:inline-flex;align-items:stretch;border-radius:4px}
.splitwrap:hover{box-shadow:inset 0 0 0 1px #d6d6d6}
.splitwrap.vert{flex-direction:column}
.splitwrap .btn.arrow{padding:0 2px;min-width:13px;height:24px}
.splitwrap.vert .btn.arrow{height:auto;min-height:15px;border-top-left-radius:0;border-top-right-radius:0;padding:0}
.splitwrap.vert .btn.big{border-bottom-left-radius:0;border-bottom-right-radius:0}
.splitwrap:not(.vert) .btn:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.splitwrap:not(.vert) .btn.arrow{border-top-left-radius:0;border-bottom-left-radius:0}
.vsep{width:1px;height:18px;background:#e1e1e1;margin:0 3px}
.combo{display:flex;align-items:center;height:24px;border:1px solid #d1d1d1;border-bottom-color:#a8a8a8;background:#fff;border-radius:4px;position:relative}
.combo:hover{border-color:#c2c2c2;border-bottom-color:#8a8a8a}
.combo input{border:0;outline:0;background:transparent;height:22px;padding:0 5px;min-width:0;font-size:12px}
.combo:focus-within{border-bottom:2px solid var(--blue);height:24px}
.combo .dd{width:18px;height:22px;display:grid;place-items:center;cursor:pointer;border:0;background:none;padding:0;border-radius:0 3px 3px 0}
.combo .dd::after{content:"";border:3.5px solid transparent;border-top:4px solid #616161;margin-top:3px}
.combo .dd:hover{background:#ebebeb}
#c-fontName{width:136px}#c-fontName input{width:104px}
#c-fontSize{width:52px}#c-fontSize input{width:30px;text-align:left}
.gallery{display:flex;align-items:stretch;border:1px solid #e1e1e1;background:#fff;border-radius:4px;height:70px;margin-top:1px;overflow:hidden}
.gallery .tiles{display:flex;padding:2px;gap:2px}
.tile{width:74px;border:1px solid transparent;background:#fff;padding:6px 5px 0;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;overflow:hidden;text-align:left;border-radius:3px;gap:0}
.tile:hover{border-color:#c7c7c7;background:#f5f5f5}.tile.on{border:1px solid #8a8a8a;background:#ebebeb}
.tile .sample{font-size:12px;line-height:1.1;max-width:66px;overflow:hidden;white-space:nowrap;height:26px;display:flex;align-items:flex-end}
.tile .nm{font-size:10.5px;color:#424242;margin-top:auto;padding-bottom:5px;font-family:var(--ui)}
.gscroll{width:17px;display:flex;flex-direction:column;border-left:1px solid #e8e8e8}
.gscroll button{flex:1;border:0;background:#fff;padding:0;display:grid;place-items:center}.gscroll button:hover{background:#ebebeb}
.gscroll button::after{content:"";border:3.5px solid transparent}
.gscroll .up::after{border-bottom:4px solid #616161;margin-bottom:2px}.gscroll .dn::after{border-top:4px solid #616161;margin-top:2px}
.gscroll .mr::after{border-top:4px solid #616161;margin-top:2px;box-shadow:0 -6px 0 -1px #616161}
.num{width:64px;height:24px;border:1px solid #d1d1d1;border-bottom-color:#a8a8a8;border-radius:4px;padding:0 4px;background:#fff;outline:0}
.num:focus{border-bottom:2px solid var(--blue)}
.lblr{font-size:12px;width:96px;text-align:left;color:#424242}
.spot{animation:spot 1.1s ease-in-out infinite;outline:2px solid #ff8c00!important;outline-offset:1px;z-index:5;position:relative;background:#fff3d6!important;border-radius:4px}
@keyframes spot{0%,100%{box-shadow:0 0 0 0 rgba(255,140,0,.65)}50%{box-shadow:0 0 0 9px rgba(255,140,0,0)}}

/* ---------- Descrizione comando ---------- */
#tip{position:fixed;z-index:1000;background:#fff;border:1px solid #d1d1d1;box-shadow:0 4px 12px rgba(0,0,0,.16);padding:8px 11px 9px;max-width:270px;pointer-events:none;display:none;font-size:12px;border-radius:4px}
#tip b{display:block;margin-bottom:4px;font-weight:600}#tip b em{font-style:normal;font-weight:400;color:#616161;margin-left:6px}
#tip p{margin:0;color:#424242;line-height:1.4}

/* ---------- Menu ---------- */
.popup{position:fixed;z-index:900;background:#fff;border:1px solid #e0e0e0;box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:6px;padding:4px;min-width:200px;max-height:80vh;overflow:auto;font-size:12.5px;animation:pdn .12s ease-out}
@keyframes pdn{from{transform:translateY(-4px);opacity:0}to{transform:none;opacity:1}}
.popup .mi{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 8px;cursor:pointer;white-space:nowrap;min-height:30px;border-radius:4px}
.popup .mi:hover{background:#f0f0f0}.popup .mi.on{background:#e6e6e6;font-weight:600}
.popup .mi .mic{width:20px;display:grid;place-items:center}
.popup .mi .sc{margin-left:auto;padding-left:24px;color:#757575}
.popup .mi.dis{opacity:.45;pointer-events:none}
.popup hr{border:0;border-top:1px solid #e8e8e8;margin:4px -4px}
.popup .mh{padding:6px 10px;font-weight:600;color:#424242;background:#f5f5f5;margin:2px -4px;font-size:12px}
.popup .mh:first-child{margin-top:-4px;border-radius:6px 6px 0 0}
.swatches{display:grid;grid-template-columns:repeat(10,17px);gap:3px;padding:4px 10px 6px}
.sw{width:17px;height:17px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0;border-radius:2px}.sw:hover{outline:2px solid #616161;outline-offset:1px;z-index:2}
.popup .cap{padding:6px 10px 2px;color:#424242;font-size:12px;font-weight:600}
.tblgrid{padding:6px 6px}
.tblgrid .lab{font-size:12px;margin-bottom:6px;color:#242424;font-weight:600}
.tblgrid .g{display:grid;grid-template-columns:repeat(10,18px);gap:2px}
.tblgrid .g i{width:18px;height:18px;border:1px solid #c7c7c7;background:#fff;display:block}.tblgrid .g i.h{border-color:#d9691f;background:#fde9d9}
.shapegrid{display:grid;grid-template-columns:repeat(6,34px);gap:2px;padding:6px 6px}
.shapegrid button{width:34px;height:34px;border:1px solid transparent;background:#fff;display:grid;place-items:center;border-radius:4px}.shapegrid button:hover{background:#f0f0f0;border-color:#d1d1d1}
.charm{display:grid;grid-template-columns:repeat(8,38px);gap:2px;padding:6px}
.charm button{width:38px;height:38px;border:1px solid #e0e0e0;background:#fff;font-size:18px;border-radius:4px}.charm button:hover{background:#f0f0f0;border-color:#c7c7c7}
.pgprev{width:62px;height:78px;border:1px solid #c7c7c7;background:#fff;position:relative;margin:4px auto}
.gal{display:flex;flex-wrap:wrap;gap:6px;padding:6px;width:340px}
.gal .card{width:100px;border:1px solid #e0e0e0;border-radius:4px;padding:6px;cursor:pointer;background:#fff;font-size:11px;text-align:center}.gal .card:hover{border-color:#8a8a8a;background:#f5f5f5}

/* ---------- Area di lavoro ---------- */
#main{flex:1;display:flex;min-height:0;position:relative;background:var(--canvas)}
#navpane,#sidepane{width:288px;background:#fff;display:none;flex-direction:column;flex:none;border-right:1px solid #e0e0e0;z-index:5}
#sidepane{border-right:0;border-left:1px solid #e0e0e0;width:310px}
#navpane.show,#sidepane.show{display:flex}
.pane-h{display:flex;align-items:center;padding:12px 12px 8px 16px;font-weight:600;font-size:15px;gap:8px}
.pane-h .x{margin-left:auto;border:0;background:none;font-size:14px;width:28px;height:28px;border-radius:4px;color:#424242}.pane-h .x:hover{background:#ebebeb}
.pane-tabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid #e8e8e8}
.pane-tabs button{border:0;background:none;padding:7px 0;border-bottom:2px solid transparent;color:#424242}.pane-tabs button.on{border-color:var(--blue);color:#242424;font-weight:600}
.pane-b{flex:1;overflow:auto;padding:8px 16px}
.pane-b .srch{display:flex;border:1px solid #d1d1d1;border-bottom-color:#8a8a8a;border-radius:4px;margin-bottom:8px;background:#fff}.pane-b .srch:focus-within{border-bottom:2px solid var(--blue)}.pane-b .srch input{flex:1;border:0;outline:0;padding:6px 8px;min-width:0;background:transparent}.pane-b .srch button{border:0;background:none;width:28px;border-radius:3px}.pane-b .srch button:hover{background:#ebebeb}
.hitem{padding:6px 8px;border-radius:4px;cursor:pointer;color:#242424}.hitem:hover{background:#f0f0f0}
.hitem.l2{padding-left:24px}.hitem.l3{padding-left:40px;color:#424242}
.resitem{padding:7px 8px;border-radius:4px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:12px;line-height:1.4}.resitem:hover{background:#f5f5f5}.resitem.cur{background:#e6e6e6}
.resitem mark{background:#ffe38a;padding:0;font-weight:600}
.cmtcard{border:1px solid #e0e0e0;background:#fff;border-radius:6px;padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cmtcard:focus-within{border-color:#8a8a8a;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.cmtcard .who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px;margin-bottom:6px}.cmtcard .who b{width:24px;height:24px;border-radius:50%;background:#c19c00;color:#fff;display:grid;place-items:center;font-size:9.5px}
.cmtcard .q{color:#616161;font-size:11.5px;border-left:3px solid #d1d1d1;padding-left:7px;margin-bottom:6px;max-height:34px;overflow:hidden}
.cmtcard textarea{width:100%;border:1px solid #d1d1d1;border-radius:4px;padding:6px;resize:vertical;min-height:46px;outline:0}.cmtcard textarea:focus{border-bottom:2px solid var(--blue)}
.cmtcard .acts{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.spitem{border:1px solid #e0e0e0;border-radius:6px;padding:9px 11px;margin-bottom:8px}.spitem .w{font-weight:600;color:#c50f1f;margin-bottom:4px;text-decoration:underline wavy #c50f1f;text-underline-offset:3px}.spitem .why{color:#616161;font-size:11.5px;margin-bottom:7px}
.spitem .acts{display:flex;gap:6px}

POP.tableGrid = () => {
  const p = h('div', { class: 'tblgrid' }), lab = h('div', { class: 'lab' }, 'Inserisci tabella'), g = h('div', { class: 'g' });
  for (let r = 1; r <= 8; r++) for (let c = 1; c <= 10; c++) g.append(h('i', { 'data-r': r, 'data-c': c }));
  let cur = null;
  const mark = (r, c) => { cur = r && c ? [r, c] : null; lab.textContent = cur ? `${c} x ${r} Tabella` : 'Inserisci tabella'; $$('i', g).forEach(x => x.classList.toggle('h', !!cur && +x.dataset.r <= r && +x.dataset.c <= c)); };
  const at = e => { const t = document.elementFromPoint(e.clientX, e.clientY); return t && t.matches && t.matches('.tblgrid i') ? [+t.dataset.r, +t.dataset.c] : null; };
  g.addEventListener('pointermove', e => { const a = at(e); if (a) mark(a[0], a[1]); });
  g.addEventListener('mouseover', e => { const t = e.target; if (t.dataset && t.dataset.r) mark(+t.dataset.r, +t.dataset.c); });
  g.addEventListener('pointerleave', () => mark(0, 0));
  g.addEventListener('click', e => { const t = e.target; const a = t.dataset && t.dataset.r ? [+t.dataset.r, +t.dataset.c] : cur; if (!a) return; closePopups(); run('table', a, 'tableGrid'); });
  p.append(lab, g, h('hr'), menuEl([{ lb: 'Inserisci tabella...', ic: 'table', cmd: 'tableDlg' }])); return p;
};

], { watch: { chars: { bold: ['Destinazione da formattare', 'Testo disordinato'], italic: ['Testo disordinato'], color: ['Destinazione da formattare', 'Testo disordinato'], size: ['Destinazione da formattare', 'Testo disordinato'] } } });

L(2, 'Allineamento del testo', 'L\'allineamento stabilisce come il testo si dispone tra i margini: <b>sinistra</b> (Ctrl+L), <b>centro</b> (Ctrl+E), <b>destra</b> (Ctrl+R), <b>giustificato</b> (Ctrl+J). Basta avere il cursore nel paragrafo: non serve selezionarlo tutto.',
  '<h1 style="text-align:left">Relazione Annuale 2026</h1><p style="text-align:left">Milano, 15 giugno 2026</p><p style="text-align:left">Il presente documento descrive le attività svolte nel corso dell\'anno solare e i risultati raggiunti rispetto agli obiettivi fissati dalla direzione.</p>', [
  { text: 'Fai clic nel titolo e <b>centralo</b> (pulsante Centra).', cmds: ['align'], path: ['alignC'], done: Q => Q.block('Relazione Annuale 2026') && getComputedStyle(Q.block('Relazione Annuale 2026')).textAlign === 'center', hints: ['Clicca una volta dentro il titolo «Relazione Annuale 2026».', 'Nel gruppo Paragrafo premi il secondo pulsante delle quattro righe (Centra).'], solve: Q => { Q.caret('Relazione Annuale 2026'); run('align', 'center'); }, ok: 'Titolo centrato.' },
  { text: 'Allinea <b>a destra</b> la data «Milano, 15 giugno 2026».', cmds: ['align'], path: ['alignR'], done: Q => getComputedStyle(Q.block('Milano, 15 giugno 2026')).textAlign === 'right', hints: ['Clicca nella riga della data, poi usa il pulsante Allinea a destra (terzo).'], solve: Q => { Q.caret('Milano, 15 giugno 2026'); run('align', 'right'); }, ok: 'Data a destra.' },
  { text: '<b>Giustifica</b> il paragrafo lungo: i bordi destro e sinistro diventano dritti.', cmds: ['align'], path: ['alignJ'], done: Q => { const b = Q.block('Il presente documento'); return !!b && getComputedStyle(b).textAlign === 'justify'; }, hints: ['Clicca nel paragrafo lungo e premi il quarto pulsante (Giustifica).'], solve: Q => { Q.caret('Il presente documento'); run('align', 'justify'); }, ok: 'Testo giustificato.' }
], { watch: { blocks: { align: { 'Relazione Annuale 2026': 'center', 'Milano, 15 giugno 2026': 'right', 'Il presente documento descrive le attività svolte nel corso dell\'anno solare e i risultati raggiunti rispetto agli obiettivi fissati dalla direzione.': 'justify' } } } });
L(2, 'Elenchi puntati e numerati', 'Gli <b>elenchi puntati</b> servono per voci senza ordine; i <b>numerati</b> per sequenze di passaggi. Seleziona le righe e premi il pulsante: Word aggiunge da solo punti o numeri.',
  '<p>Requisiti minimi del computer:</p><p>Memoria RAM 8 GB</p><p>Processore quad core</p><p>Spazio su disco 50 GB</p><p>Passaggi di installazione:</p><p>Scaricare il programma</p><p>Avviare il file di installazione</p><p>Riavviare il computer</p>', [
  { text: 'Seleziona le <b>tre righe</b> sotto «Requisiti minimi» e crea un <b>Elenco puntato</b>.', cmds: ['bullets'], path: ['bullets'], done: Q => ['Memoria RAM 8 GB', 'Processore quad core', 'Spazio su disco 50 GB'].every(t => { const b = Q.block(t); return b && b.closest('ul'); }), hints: ['Trascina dal primo all\'ultimo dei tre requisiti, senza includere la riga «Requisiti minimi…».', 'Nel gruppo Paragrafo premi il primo pulsante (elenco con i pallini).'], solve: Q => { const a = Q.range('Memoria RAM 8 GB'), b = Q.range('Spazio su disco 50 GB'); const r = document.createRange(); r.setStart(a.startContainer, a.startOffset); r.setEnd(b.endContainer, b.endOffset); focusRoot(); setRange(r); run('bullets', 'toggle'); }, ok: 'Elenco puntato creato.' },
  { text: 'Seleziona i <b>tre passaggi</b> di installazione e crea un <b>Elenco numerato</b>.', cmds: ['numbers'], path: ['numbers'], done: Q => ['Scaricare il programma', 'Avviare il file di installazione', 'Riavviare il computer'].every(t => { const b = Q.block(t); return b && b.closest('ol'); }), hints: ['Seleziona le tre righe sotto «Passaggi di installazione».', 'Premi il secondo pulsante di elenco (con i numeri 1, 2, 3).'], solve: Q => { const a = Q.range('Scaricare il programma'), b = Q.range('Riavviare il computer'); const r = document.createRange(); r.setStart(a.startContainer, a.startOffset); r.setEnd(b.endContainer, b.endOffset); focusRoot(); setRange(r); run('numbers', 'toggle'); }, ok: 'Elenco numerato creato.' }
], { watch: { blocks: { list: { 'Memoria RAM 8 GB': 'ul', 'Processore quad core': 'ul', 'Spazio su disco 50 GB': 'ul', 'Scaricare il programma': 'ol', 'Avviare il file di installazione': 'ol', 'Riavviare il computer': 'ol' } }, hints: { list: 'il tipo di elenco indicato' } } });
L(2, 'Interlinea e rientri', 'L\'<b>interlinea</b> è lo spazio tra le righe di un paragrafo; il <b>rientro</b> sposta il paragrafo verso destra. Entrambi si trovano nel gruppo Paragrafo.',
  '<p>Questo primo paragrafo ha interlinea normale e deve essere portato a interlinea doppia per facilitare la lettura e le correzioni a penna del documento.</p><p>Questo secondo paragrafo deve avere un rientro a sinistra per risaltare come una citazione.</p>', [
  { text: 'Imposta l\'<b>interlinea 2,0</b> sul primo paragrafo (pulsante Interlinea e spaziatura).', cmds: ['lineSp'], path: ['lineSpacing', 'ls-2'], done: Q => { const b = Q.block('Questo primo paragrafo'); return !!b && Math.abs(curLsOf(b) - 2) < .05; }, hints: ['Clicca nel primo paragrafo, poi sul pulsante con le frecce su/giù nel gruppo Paragrafo.', 'Dal menu scegli «2,0».'], solve: Q => { Q.caret('Questo primo paragrafo'); run('lineSp', 2); }, ok: 'Righe più distanziate.' },
  { text: 'Clicca nel secondo paragrafo e premi <b>Aumenta rientro</b> una volta.', cmds: ['indentInc'], path: ['indentInc'], done: Q => { const b = Q.block('Questo secondo paragrafo'); return !!b && (parseFloat(getComputedStyle(b).marginLeft) || 0) >= 40; }, hints: ['Il pulsante Aumenta rientro mostra delle righe con una freccia verso destra.'], solve: Q => { Q.caret('Questo secondo paragrafo'); run('indentInc'); }, ok: 'Paragrafo rientrato.' }
], { watch: { blocks: { ls: { 'Questo primo paragrafo ha interlinea normale e deve essere portato a interlinea doppia per facilitare la lettura e le correzioni a penna del documento.': v => Math.abs(v - 2) < .05 }, ind: { 'Questo secondo paragrafo deve avere un rientro a sinistra per risaltare come una citazione.': v => v >= 40 } }, hints: { ls: 'l\'interlinea <b>2,0</b>', ind: 'un rientro verso destra' } } });

L(3, 'Applicare gli stili', 'Gli <b>stili</b> (Titolo, Titolo 1, Titolo 2…) formattano i titoli con un clic e permettono a Word di creare indici e navigare nel documento. Non serve selezionare: basta il cursore nel paragrafo.',
  '<p>Piano Operativo</p><p>Il piano descrive le attività da svolgere nel prossimo trimestre.</p><p>Introduzione</p><p>Il progetto nasce dall\'esigenza di migliorare i processi interni.</p><p>Fasi del progetto</p><p>Le fasi sono tre: analisi, sviluppo e collaudo.</p>', [
  { text: 'Applica lo stile <b>Titolo</b> a «Piano Operativo».', cmds: ['style'], path: ['style-title'], done: Q => styleOfBlock(Q.block('Piano Operativo')) === 'title', hints: ['Clicca dentro «Piano Operativo» e scegli la tessera «Titolo» nella galleria Stili.', 'Se non la vedi, usa la freccetta a destra della galleria per aprirla.'], solve: Q => { Q.caret('Piano Operativo'); run('style', 'title'); }, ok: 'Stile Titolo applicato.' },
  { text: 'Applica <b>Titolo 1</b> a «Introduzione».', cmds: ['style'], path: ['style-h1'], done: Q => styleOfBlock(Q.block('Introduzione')) === 'h1', hints: ['Clicca in «Introduzione» e scegli «Titolo 1».'], solve: Q => { Q.caret('Introduzione'); run('style', 'h1'); }, ok: 'Titolo 1 applicato.' },
  { text: 'Applica <b>Titolo 2</b> a «Fasi del progetto».', cmds: ['style'], path: ['style-h2'], done: Q => styleOfBlock(Q.block('Fasi del progetto')) === 'h2', hints: ['Clicca in «Fasi del progetto» e scegli «Titolo 2».'], solve: Q => { Q.caret('Fasi del progetto'); run('style', 'h2'); }, ok: 'Gerarchia dei titoli completata.' }
], { watch: { blocks: { tag: { 'Piano Operativo': 'title', 'Introduzione': 'h1', 'Fasi del progetto': 'h2' } } } });
L(3, 'Inserire una tabella', 'Le <b>tabelle</b> organizzano i dati in righe e colonne. Inserisci › Tabella: trascina sulla griglia per scegliere le dimensioni. Con il cursore dentro la tabella compare la scheda <b>Layout tabella</b>.',
  '<p>Di seguito i dati dei partecipanti:</p><p><br></p>', [
  { text: 'Vai su <b>Inserisci › Tabella</b> e crea una tabella di <b>3 colonne × 3 righe</b>.', cmds: ['table'], path: ['tab:insert', 'tableBtn'], done: Q => { const t = ed.querySelector('table'); return !!t && t.rows.length >= 3 && gridCols(t) >= 3; }, hints: ['Apri la scheda Inserisci, poi clicca il pulsante Tabella.', 'Muovi il mouse sulla griglia fino a leggere «3 x 3 Tabella» e clicca.'], solve: Q => { Q.caret('Di seguito i dati dei partecipanti:', true); run('table', [3, 3]); }, ok: 'Tabella inserita!' },
  { text: 'Fai clic nella <b>prima cella</b> e scrivi esattamente <b>Nome</b>.', typing: true, done: Q => { const t = ed.querySelector('table'); return !!t && stripT(t.rows[0].cells[0].textContent) === 'Nome'; }, wrong: Q => { const t = ed.querySelector('table'); if (!t) return null; const v = stripT(t.rows[0].cells[0].textContent); if (v && !'Nome'.startsWith(v)) { let i = 0; while (i < v.length && v[i] === 'Nome'[i]) i++; return { title: 'C\'è un errore di battitura', msg: `Hai scritto «<b>${esc(v)}</b>» ma serve «<b>Nome</b>». La lettera sbagliata è la n. ${i + 1} («${esc(v[i])}» al posto di «${'Nome'[i] || '—'}»). Cancella con Backspace e riprova, facendo attenzione alle maiuscole.` }; } return null; }, hints: ['Clicca nella cella in alto a sinistra: lampeggia il cursore.', 'Digita N-o-m-e (la N è maiuscola).'], solve: Q => { const t = ed.querySelector('table'); focusCell(t.rows[0].cells[0]); document.execCommand('insertText', false, 'Nome'); histPush(); afterChange('x'); }, ok: 'Cella compilata. Con Tab passi alla cella successiva.' },
  { text: 'Nella scheda <b>Layout tabella</b> clicca <b>Inserisci sotto</b> per aggiungere una riga.', cmds: ['tRowBelow', 'tRowAbove'], path: ['tab:table', 'tRowBelow'], done: Q => { const t = ed.querySelector('table'); return !!t && t.rows.length >= 4; }, hints: ['Con il cursore nella tabella, in alto compare la scheda viola «Layout tabella».', 'Nel gruppo Righe e colonne scegli «Inserisci sotto».', 'Scorciatoia: premi Tab nell\'ultima cella.'], solve: Q => { const t = ed.querySelector('table'); focusCell(t.rows[0].cells[0]); run('tRowBelow'); }, ok: 'Riga aggiunta: ora la tabella ha 4 righe.' }
], { protect: false, cmds: ['table', 'tRowBelow', 'tRowAbove'] });

L(4, 'Forme e immagini', 'Dalla scheda <b>Inserisci</b> puoi aggiungere <b>forme</b> e <b>immagini</b>. Cliccando un oggetto compaiono le maniglie per ridimensionarlo e la scheda <b>Formato oggetto</b> per colori e disposizione.',
  '<p>Inserisci qui sotto una forma e un\'immagine:</p><p><br></p>', [
  { text: 'Inserisci › <b>Forme</b> › scegli il <b>Rettangolo</b>.', cmds: ['shape'], path: ['tab:insert', 'shapesBtn', 'shape-rect'], done: Q => !!ed.querySelector('svg[data-shape="rect"]'), hints: ['Apri Inserisci e clicca Forme.', 'Nella sezione «Forme di base» scegli il primo quadratino (rettangolo).'], solve: Q => { Q.caret('Inserisci qui sotto una forma e un\'immagine:', true); run('shape', 'rect'); }, ok: 'Forma inserita. Trascina le maniglie per ridimensionarla.' },
  { text: 'Inserisci › <b>Immagini</b> › <b>Immagine di esempio</b>.', cmds: ['picture'], path: ['tab:insert', 'picBtn', 'picSample'], done: Q => !!ed.querySelector('img'), hints: ['Nella scheda Inserisci clicca Immagini.', 'Scegli «Immagine di esempio» (con «Da questo dispositivo» potresti caricare un tuo file).'], solve: Q => { run('picture', 'sample'); }, ok: 'Immagine inserita.' },
  { text: 'Seleziona la forma (clic su di essa) e cambia il <b>Riempimento</b> con un colore diverso dal blu, dalla scheda <b>Formato oggetto</b>.', cmds: ['objFill'], path: ['tab:pic', 'oFill'], done: Q => { const s = ed.querySelector('svg[data-shape]'); return !!s && s.dataset.fill !== '#4472c4'; }, hints: ['Clicca sulla forma blu: attorno compaiono le maniglie e si apre la scheda viola «Formato oggetto».', 'Premi Riempimento e scegli un colore.'], solve: Q => { const s = ed.querySelector('svg[data-shape]'); selectObj(s); run('objFill', '#ed7d31'); }, ok: 'Forma ricolorata.' }
], { cmds: ['shape', 'picture', 'objFill', 'objSize'] });
L(4, 'Intestazione e numero di pagina', 'L\'<b>intestazione</b> (in alto) e il <b>piè di pagina</b> (in basso) si ripetono su ogni pagina: ideali per titoli e numerazione. Si modificano da Inserisci o con un doppio clic sulla zona del margine.',
  '<p>Questo documento ha bisogno di un\'intestazione e di un numero di pagina.</p>', [
  { text: 'Inserisci › <b>Intestazione</b> › <b>Modifica intestazione</b>.', cmds: ['header'], path: ['tab:insert', 'headerBtn', 'hdrEdit'], done: Q => S.hfMode === 'hdr' || !!S.hdr, hints: ['Nella scheda Inserisci clicca Intestazione.', 'Scegli «Modifica intestazione»: l\'area in alto diventa modificabile.', 'In alternativa fai doppio clic nel margine superiore della pagina.'], solve: Q => run('header'), ok: 'Sei nell\'area dell\'intestazione.' },
  { text: 'Scrivi nell\'intestazione: <b>Corso Word 365</b>.', typing: true, done: Q => /Corso Word 365/.test(clean(S.hfMode === 'hdr' ? ($('.sheet .hf.edit') || { textContent: '' }).textContent : S.hdr.replace(/<[^>]+>/g, ''))), wrong: Q => { const t = S.hfMode === 'hdr' && $('.sheet .hf.edit') ? stripT($('.sheet .hf.edit').textContent) : ''; if (t && !'Corso Word 365'.startsWith(t) && !t.startsWith('Corso Word 365')) { let i = 0; while (i < t.length && t[i] === 'Corso Word 365'[i]) i++; return { title: 'Errore di battitura', msg: `Hai scritto «<b>${esc(t)}</b>» ma serve «<b>Corso Word 365</b>»: il primo carattere diverso è il n. ${i + 1}.` }; } return null; }, hints: ['Digita il testo direttamente nell\'area tratteggiata in alto.'], solve: Q => { const el = $('.sheet .hf.edit'); el.focus(); document.execCommand('insertText', false, 'Corso Word 365'); emit('change', 'hf'); }, ok: 'Intestazione scritta.' },
  { text: 'Clicca <b>Chiudi intestazione e piè di pagina</b> (o premi <kbd>Esc</kbd>).', cmds: ['hfClose'], path: ['tab:hf', 'hfClose'], done: Q => !S.hfMode && /Corso Word 365/.test(S.hdr), hints: ['Nella scheda viola «Intestazione e piè di pagina» premi il pulsante con il segno di spunta.'], solve: Q => run('hfClose'), ok: 'Torni al corpo del documento.' },
  { text: 'Inserisci › <b>Numero di pagina</b> › <b>Fondo pagina</b> › <b>Centrato</b>.', cmds: ['pageNum'], path: ['tab:insert', 'pageNumBtn', 'pn-bc'], done: Q => /data-f="page"/.test(S.ftr), hints: ['Scheda Inserisci › Numero di pagina.', 'Sotto «Fondo pagina» scegli «Centrato».'], solve: Q => run('pageNum', ['bottom', 'center']), ok: 'Numero di pagina inserito in fondo al foglio.' }
], { protect: false, cmds: ['header', 'pageNum', 'hfClose'] });
L(4, 'Interruzione di pagina', 'Una <b>interruzione di pagina</b> fa iniziare il testo successivo su una nuova pagina. Si inserisce con <kbd>Ctrl</kbd>+<kbd>Invio</kbd> o da Inserisci. Nella barra di stato vedi quante pagine ha il documento.',
  '<p>Capitolo 1</p><p>Questo è il testo del primo capitolo.</p><p>Capitolo 2</p><p>Questo è il testo del secondo capitolo.</p>', [
  { text: 'Posiziona il cursore <b>all\'inizio</b> di «Capitolo 2» (clicca davanti alla «C»).', soft: true, done: Q => Q.caretAtStartOf('Capitolo 2'), hints: ['Clicca prima della lettera C di «Capitolo 2», poi premi il tasto Home per essere sicuro di essere all\'inizio della riga.'], solve: Q => Q.caret('Capitolo 2'), ok: 'Cursore al punto giusto.' },
  { text: 'Premi <kbd>Ctrl</kbd>+<kbd>Invio</kbd> (o Inserisci › Interruzione di pagina): il documento deve passare a <b>2 pagine</b>.', cmds: ['pageBreak'], path: ['tab:insert', 'pagebreak'], done: Q => !!ed.querySelector('.pb') && S.nPages >= 2 && ed.querySelector('.pb').nextElementSibling && stripT(ed.querySelector('.pb').nextElementSibling.textContent) === 'Capitolo 2', hints: ['Tieni premuto Ctrl e premi Invio.', 'Oppure scheda Inserisci › Interruzione di pagina.'], solve: Q => { Q.caret('Capitolo 2'); run('pageBreak'); }, ok: 'Ora «Capitolo 2» inizia su una nuova pagina (guarda la barra di stato).' }
], { wrong: Q => { const pb = ed.querySelector('.pb'); if (!pb) return null; const nx = pb.nextElementSibling; if (!nx || stripT(nx.textContent) !== 'Capitolo 2') return { title: 'Interruzione nel punto sbagliato', msg: `L'interruzione di pagina è finita prima di «<b>${esc(shortT(nx ? nx.textContent : '(fine documento)'))}</b>», ma doveva stare subito prima di «Capitolo 2». Premi Ctrl+Z e riprova dopo aver posizionato il cursore all'inizio di «Capitolo 2».` }; return null; }, cmds: ['pageBreak'] });
L(4, 'Margini e orientamento', 'Dalla scheda <b>Layout</b> imposti la pagina: i <b>margini</b> (spazio bianco attorno al testo) e l\'<b>orientamento</b> (verticale o orizzontale). Guarda il righello e la pagina cambiare in tempo reale.',
  '<p>Questo documento richiede margini stretti e un orientamento orizzontale per contenere una tabella molto larga.</p>', [
  { text: 'Layout › <b>Margini</b> › <b>Stretti</b>.', cmds: ['margins', 'pageSetup'], path: ['tab:layout', 'marginsBtn', 'mg-narrow'], done: Q => Math.abs(S.page.left - 1.27) < .02 && Math.abs(S.page.top - 1.27) < .02, hints: ['Apri la scheda Layout e clicca Margini.', 'Scegli «Stretti» (1,27 cm su tutti i lati).'], solve: Q => run('margins', 'narrow'), ok: 'Margini ridotti: più spazio per il testo.' },
  { text: 'Layout › <b>Orientamento</b> › <b>Orizzontale</b>.', cmds: ['orientation', 'pageSetup'], path: ['tab:layout', 'orientBtn', 'or-l'], done: Q => S.page.orient === 'l', hints: ['Nella stessa scheda clicca Orientamento e scegli Orizzontale.'], solve: Q => run('orientation', 'landscape'), ok: 'La pagina ora è orizzontale.' }
], { cmds: ['margins', 'orientation', 'pageSetup'] });

L(5, 'Trova e sostituisci', '<b>Trova</b> (<kbd>Ctrl</kbd>+<kbd>F</kbd>) cerca una parola; <b>Sostituisci</b> (<kbd>Ctrl</kbd>+<kbd>H</kbd>) la cambia automaticamente in tutto il documento: molto più veloce che correggere a mano.',

L(5, 'Rinominare e salvare', 'Dai un nome al documento (clic sul titolo in alto) e salvalo spesso con <kbd>Ctrl</kbd>+<kbd>S</kbd>. Da File › Esporta puoi ottenere un file Word, una pagina web o un PDF.',
  `<h1>Il mio primo documento: riepilogo dei comandi</h1><p>Questo è il tuo primo file salvato. Qui trovi tutti i comandi che hai imparato e come si eseguono. Rinominalo e salvalo, poi consultalo quando ti serve.</p>
<h2>1. Le basi</h2><ul>
<li><b>Selezionare</b> – doppio clic su una parola, triplo clic su un paragrafo, trascinando con il mouse una parte di testo; <b>Ctrl+A</b> seleziona tutto il documento.</li>
<li><b>Annullare / Ripristinare</b> – <b>Ctrl+Z</b> annulla l'ultima azione, <b>Ctrl+Y</b> la ripristina (anche le frecce in alto a sinistra).</li>
<li><b>Copiare, Tagliare, Incollare</b> – seleziona il testo, poi <b>Ctrl+C</b> (copia), <b>Ctrl+X</b> (taglia), clic nel punto di arrivo e <b>Ctrl+V</b> (incolla). Gli stessi pulsanti sono in Home › Appunti.</li></ul>
<h2>2. Formattare il testo (Home › Carattere)</h2><ul>
<li><b>Grassetto</b> – seleziona il testo e premi <b>Ctrl+B</b> o il pulsante <b>G</b>.</li>
<li><b>Corsivo e Sottolineato</b> – <b>Ctrl+I</b> e <b>Ctrl+U</b>, oppure i pulsanti <b>C</b> e <b>S</b>.</li>
<li><b>Tipo e dimensione del carattere</b> – seleziona il testo e scegli il font e la dimensione dalle caselle in Home › Carattere.</li>
<li><b>Colore del testo ed evidenziatore</b> – pulsante «A» colorata per il colore, pennarello giallo per evidenziare: scegli il colore dalla freccina accanto.</li>
<li><b>Copia formato</b> – seleziona il testo che ha l'aspetto giusto, clicca il pennello (Home › Appunti), poi seleziona il testo da formattare. Doppio clic sul pennello per usarlo più volte.</li>
<li><b>Cancella formattazione</b> – seleziona il testo e premi il pulsante con la gomma (Home › Carattere).</li></ul>
<h2>3. Formattare il paragrafo (Home › Paragrafo)</h2><ul>
<li><b>Allineamento</b> – a sinistra <b>Ctrl+L</b>, centrato <b>Ctrl+E</b>, a destra <b>Ctrl+R</b>, giustificato <b>Ctrl+J</b>.</li>
<li><b>Elenchi puntati e numerati</b> – clicca il pulsante dell'elenco e scrivi una voce per riga; premi Invio due volte per terminare l'elenco.</li>
<li><b>Interlinea e rientri</b> – pulsante Interlinea per lo spazio tra le righe; pulsanti Aumenta/Riduci rientro per spostare il paragrafo.</li></ul>
<h2>4. Stili e tabelle</h2><ul>
<li><b>Stili</b> – con il cursore nel titolo scegli Titolo 1, Titolo 2… dalla galleria Stili in Home.</li>
<li><b>Tabella</b> – Inserisci › Tabella, trascina sulla griglia per scegliere righe e colonne. Con <b>Tab</b> passi alla cella successiva.</li></ul>
<h2>5. Oggetti e pagina</h2><ul>
<li><b>Forme e immagini</b> – Inserisci › Forme / Immagini; clicca l'oggetto per spostarlo, ridimensionarlo o cambiarne il riempimento dalla scheda Formato.</li>
<li><b>Intestazione e piè di pagina</b> – Inserisci › Intestazione (o Piè di pagina) › Modifica; per chiudere premi Esc o il pulsante di chiusura.</li>
<li><b>Numero di pagina</b> – Inserisci › Numero di pagina › Fondo pagina › Centrato.</li>
<li><b>Interruzione di pagina</b> – cursore all'inizio del testo che deve andare a capo pagina, poi <b>Ctrl+Invio</b>.</li>
<li><b>Margini e orientamento</b> – scheda Layout › Margini e Orientamento (verticale/orizzontale).</li></ul>
<h2>6. Strumenti utili</h2><ul>
<li><b>Trova e Sostituisci</b> – <b>Ctrl+F</b> cerca una parola, <b>Ctrl+H</b> la sostituisce con un'altra.</li>
<li><b>Collegamenti</b> – seleziona il testo e premi <b>Ctrl+K</b>, scrivi l'indirizzo web e conferma.</li>
<li><b>Simboli</b> – Inserisci › Simbolo, scegli il carattere dalla tabella.</li>
<li><b>Sommario automatico</b> – dopo aver usato gli stili Titolo, scheda Riferimenti › Sommario.</li>
<li><b>Ortografia (Editor)</b> – premi <b>F7</b>: le parole sbagliate hanno la sottolineatura rossa ondulata, scegli la correzione proposta.</li>
<li><b>Commenti</b> – seleziona una parola, Revisione › Nuovo commento e scrivi la nota nel riquadro a destra.</li></ul>
<h2>7. Rinominare e salvare</h2><ul>
<li><b>Rinominare</b> – clicca il nome del documento nella barra del titolo in alto, scrivi il nuovo nome e premi Invio.</li>
<li><b>Salvare</b> – <b>Ctrl+S</b> o l'icona del dischetto. Salva spesso mentre lavori.</li>
<li><b>Esportare</b> – File › Esporta per ottenere un file Word, una pagina web o un PDF.</li></ul>`, [
  { text: 'Nella barra del titolo, cambia il nome in <b>Il mio primo documento</b> e premi <kbd>Invio</kbd>.', typing: true, done: Q => S.title.trim() === 'Il mio primo documento', wrong: Q => { const v = S.title.trim(); const e = 'Il mio primo documento'; if (v && v !== 'Documento1' && !e.startsWith(v) && v !== e) return { title: 'Il nome non coincide', msg: `Hai scritto «<b>${esc(v)}</b>» invece di «<b>${e}</b>». Controlla maiuscole e spazi.` }; return null; }, path: ['docname'], hints: ['Clicca sul nome «Documento1» in alto, seleziona tutto e digita il nuovo nome.'], solve: Q => { const n = $('#docname'); n.value = 'Il mio primo documento'; n.dispatchEvent(new Event('input')); }, ok: 'Documento rinominato.' },
  { text: 'Premi <kbd>Ctrl</kbd>+<kbd>S</kbd> (o l\'icona del dischetto) per <b>salvare</b>.', cmds: ['save'], path: ['saveBtn'], done: Q => !!C.flags.saved, hints: ['Clicca l\'icona del dischetto in alto a sinistra.'], solve: Q => run('save'), ok: 'Documento salvato nel browser (puoi riaprirlo da File › Apri).' }
], { protect: false, cmds: ['save'], free: true });

const nameTypo = (v, e) => { let i = 0; while (i < v.length && v[i] === e[i]) i++; return i + 1; };
L(6, 'Salva con nome in formato Word (.docx)', '<b>Salva</b> (<kbd>Ctrl</kbd>+<kbd>S</kbd>) registra le modifiche, mentre <b>Salva con nome</b> (<kbd>F12</kbd>) crea un file con il <b>nome</b>, la <b>cartella</b> e il <b>formato</b> che scegli. Il formato di Word è <b>.docx</b>: è quello da usare per inviare un documento che altri dovranno modificare. Il file viene salvato nella cartella <b>Download</b> del computer.',
  LETTERA, [
  { text: 'Fai clic sulla scheda <b>File</b> (in alto a sinistra).', done: Q => $('#backstage').classList.contains('show') || !!C.flags.savedAs, path: ['tab:file'], hints: ['La scheda File è la prima a sinistra, prima di Home.', 'Si apre la schermata blu del Backstage con Nuovo, Apri, Salva…'], solve: Q => openBackstage('home'), ok: 'Sei nel Backstage, dove si gestiscono i file.' },
  { text: 'Nel menu a sinistra scegli <b>Salva con nome</b>.', done: Q => !!$('#bsSaveAs') || !!C.flags.savedAs, path: ['tab:file', 'bs-saveas'], hints: ['Nella colonna blu a sinistra cerca la voce «Salva con nome».', 'Scorciatoia: il tasto <kbd>F12</kbd> apre direttamente Salva con nome.'], solve: Q => openBackstage('saveas'), ok: 'Ecco la schermata Salva con nome.' },
  { text: `Nella casella del nome scrivi esattamente <b>${NOME_FILE}</b> (cancella prima «Documento1»).`, typing: true, done: Q => { const i = $('[data-id=bsName]'); return (i && i.value.trim() === NOME_FILE) || (!!C.flags.savedAs && C.flags.savedAs.name === NOME_FILE); }, wrong: Q => { const i = $('[data-id=bsName]'); const v = i ? i.value.trim() : ''; if (v && v !== 'Documento1' && !NOME_FILE.startsWith(v) && v !== NOME_FILE) return { title: 'Il nome del file non è corretto', msg: `Hai scritto «<b>${esc(v)}</b>» ma serve «<b>${NOME_FILE}</b>»: il primo carattere diverso è il n. ${nameTypo(v, NOME_FILE)}. Attenzione a maiuscole e spazi.` }; return null; }, path: ['bsName'], hints: ['Clicca nella casella con scritto «Documento1»: il testo viene selezionato, quindi basta digitare il nuovo nome.', `Digita ${NOME_FILE} (con la L maiuscola e gli spazi tra le parole).`], solve: Q => { if (!$('[data-id=bsName]')) openBackstage('saveas'); const i = $('[data-id=bsName]'); i.value = NOME_FILE; i.dispatchEvent(new Event('input')); }, ok: 'Nome inserito.' },
  { text: 'Nel tipo di file lascia o scegli <b>Documento di Word (*.docx)</b> e premi <b>Salva</b>.', done: Q => !!C.flags.savedAs && C.flags.savedAs.name === NOME_FILE && C.flags.savedAs.fmt === 'docx', wrong: Q => { const f = C.flags.savedAs; if (!f) return null; if (f.fmt !== 'docx') return { title: 'Formato sbagliato', msg: `Hai salvato in formato <b>${esc(f.fmt.toUpperCase())}</b>, ma l'esercizio chiede <b>Documento di Word (*.docx)</b>. Ripeti: File › Salva con nome e scegli il formato giusto.` }; if (f.name !== NOME_FILE) return { title: 'Nome del file sbagliato', msg: `Hai salvato il file come «<b>${esc(f.name)}</b>», ma doveva chiamarsi «<b>${NOME_FILE}</b>». Ripeti File › Salva con nome.` }; return null; }, path: ['bsFmt', 'bsSaveBtn'], hints: ['Sotto il nome c\'è l\'elenco del tipo di file: deve indicare «Documento di Word (*.docx)».', 'Poi premi il pulsante blu «Salva».'], solve: Q => { if (!$('[data-id=bsName]')) openBackstage('saveas'); const i = $('[data-id=bsName]'); i.value = NOME_FILE; $('[data-id=bsFmt]').value = 'docx'; $('[data-id=bsSaveBtn]').click(); }, ok: 'File salvato!' }
], { free: true, cmds: ['saveAs', 'savedAs'] });
L(6, 'Esportare in PDF', 'Il <b>PDF</b> è il formato giusto per inviare un documento da <b>leggere o stampare</b>: si apre su qualsiasi computer o telefono e mantiene l\'impaginazione identica, ma non si modifica facilmente. In Word si crea da <b>File › Esporta › Crea documento PDF/XPS</b>. Qui continui a lavorare sulla <b>stessa lettera</b> che hai appena salvato in .docx: ne crei la versione PDF.',
  LETTERA, [
  { text: 'Apri la scheda <b>File</b> e scegli <b>Esporta</b>.', done: Q => !!$('#bsExport') || !!$('[data-id=pdfName]') || !!C.flags.pdf, path: ['tab:file', 'bs-export'], hints: ['Clicca File, poi nella colonna blu a sinistra la voce «Esporta».'], solve: Q => openBackstage('export'), ok: 'Sei nella schermata Esporta.' },
  { text: 'Fai clic su <b>Crea documento PDF/XPS</b>.', done: Q => !!$('[data-id=pdfName]') || !!C.flags.pdf, path: ['tab:file', 'bs-pdf'], hints: ['È la prima voce della schermata Esporta, con l\'icona della stampante.'], solve: Q => { if (!$('#bsExport')) openBackstage('export'); run('exportPDF'); }, ok: 'Si è aperta la finestra «Pubblica come PDF o XPS».' },
  { text: `Il nome del file è già <b>${NOME_FILE}</b> (lo stesso documento che hai salvato prima): controllalo e premi <b>Pubblica</b>. Il PDF viene creato e salvato nella cartella <b>Download</b>.`, typing: true, done: Q => !!C.flags.pdf && C.flags.pdf.name === NOME_FILE, wrong: Q => { const f = C.flags.pdf; if (f && f.name !== NOME_FILE) return { title: 'Nome del PDF sbagliato', msg: `Hai pubblicato il PDF come «<b>${esc(f.name)}</b>», ma doveva chiamarsi «<b>${NOME_FILE}</b>». Ripeti File › Esporta › Crea documento PDF/XPS.` }; const i = $('[data-id=pdfName]'); const v = i ? i.value.trim() : ''; if (v && v !== S.title && !NOME_FILE.startsWith(v) && v !== NOME_FILE) return { title: 'Il nome del file non è corretto', msg: `Hai scritto «<b>${esc(v)}</b>» ma serve «<b>${NOME_FILE}</b>»: il primo carattere diverso è il n. ${nameTypo(v, NOME_FILE)}.` }; return null; }, path: ['pdfName', 'pdfPublish'], hints: ['Nella finestra «Pubblica come PDF o XPS» controlla che il nome sia quello richiesto.', 'Premi «Pubblica»: compare la conferma «PDF salvato».'], solve: Q => { if (!$('[data-id=pdfName]')) run('exportPDF'); const i = $('[data-id=pdfName]'); i.value = NOME_FILE; $('[data-id=pdfPublish]').click(); }, ok: 'PDF creato: lo trovi nella cartella in cui l\'hai salvato.' }
